<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sudoku Solver</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Sudoku Solver</h1>

        <p class="description">
            Enter the Sudoku puzzle and click Solve
        </p>

        <div id="sudoku-grid"></div>

        <div class="buttons">

            <button onclick="solveSudoku()">
                Solve Sudoku
            </button>

            <button class="clear-btn" onclick="clearGrid()">
                Clear
            </button>

        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
